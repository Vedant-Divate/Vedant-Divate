<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" role="img" aria-label="Vedant Divate — Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="55%" stop-color="#0d1426"/>
      <stop offset="100%" stop-color="#070b16"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee">
        <animate attributeName="offset" values="0%;0.45;1%" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="45%" stop-color="#a855f7">
        <animate attributeName="offset" values="0.3%;0.75;1.3%" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="offset" values="0.6%;1.05;1.5%" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6">
        <animate attributeName="x1" values="0%;-40%" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="100%;60%" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="orbA">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="340" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <g filter="url(#soft)">
      <circle cx="180" cy="70" r="150" fill="url(#orbA)">
        <animate attributeName="cx" values="180;420;180" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="70;170;70" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="250" r="170" fill="url(#orbB)">
        <animate attributeName="cx" values="980;740;980" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="250;140;250" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="330" r="130" fill="url(#orbC)">
        <animate attributeName="cy" values="330;200;330" dur="15s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g opacity="0.85">
      <circle cx="300" cy="58" r="2.5" fill="#67e8f9">
        <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="520" cy="40" r="2" fill="#c084fc">
        <animate attributeName="opacity" values="0;1;0" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="760" cy="52" r="2.5" fill="#f472b6">
        <animate attributeName="opacity" values="0;1;0" dur="6.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1040" cy="46" r="2" fill="#67e8f9">
        <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1120" cy="150" r="2" fill="#c084fc">
        <animate attributeName="opacity" values="0;1;0" dur="4.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace">
      <text x="70" y="74" font-size="19" fill="#67e8f9" opacity="0.95">$</text>
      <text x="92" y="74" font-size="19" fill="#94a3b8">cd ~/vedant-divate</text>
      <rect x="316" y="60" width="11" height="20" fill="#67e8f9" opacity="0.85">
        <animate attributeName="opacity" values="0.85;0;0.85" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="66" y="168"
          font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"
          font-size="76" font-weight="800" letter-spacing="-2"
          fill="url(#title)" filter="url(#glow)">Vedant Divate</text>

    <text x="70" y="214"
          font-family="'JetBrains Mono','Fira Code',Consolas,monospace"
          font-size="21" fill="#cbd5e1" opacity="0.92">
      software engineer<tspan fill="#64748b">  /  </tspan>full-stack<tspan fill="#64748b">  /  </tspan>ai + ml<tspan fill="#64748b">  /  </tspan>blockchain
    </text>

    <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="18">
      <g transform="translate(70,262)">
        <rect width="152" height="36" rx="18" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.45"/>
        <circle cx="22" cy="18" r="5" fill="#10b981"/>
        <text x="38" y="24" fill="#a5f3fc">Pune, India</text>
      </g>
      <g transform="translate(234,262)">
        <rect width="116" height="36" rx="18" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.45"/>
        <text x="20" y="24" fill="#e9d5ff">VIT</text>
      </g>
      <g transform="translate(362,262)">
        <rect width="196" height="36" rx="18" fill="#0f172a" stroke="#ec4899" stroke-opacity="0.45"/>
        <text x="20" y="24" fill="#fbcfe8">4 live deployments</text>
      </g>
    </g>

    <g transform="translate(70,312)">
      <rect x="0" y="-15" width="9" height="15" fill="#22d3ee" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1s" repeatCount="indefinite"/>
      </rect>
      <text x="20" y="0" font-family="'JetBrains Mono','Fira Code',Consolas,monospace"
            font-size="16" fill="#64748b" letter-spacing="1.5">github.com/Vedant-Divate</text>
    </g>

    <g opacity="0.9">
      <circle cx="1085" cy="112" r="3.5" fill="#22d3ee" filter="url(#softGlow)">
        <animate attributeName="r" values="3.5;5;3.5" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1118" cy="112" r="3.5" fill="#a855f7" filter="url(#softGlow)">
        <animate attributeName="r" values="3.5;5;3.5" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1151" cy="112" r="3.5" fill="#ec4899" filter="url(#softGlow)">
        <animate attributeName="r" values="3.5;5;3.5" dur="3.4s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="0" y="0" width="1200" height="4" fill="url(#sweep)"/>
  </g>

  <rect x="1" y="1" width="1198" height="338" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
</svg>
