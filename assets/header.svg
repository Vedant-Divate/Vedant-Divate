<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="100%" height="370" role="img" aria-label="Vedant Divate — AI &amp; Software Systems Engineer">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="45%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Deep Ambient Sapphire Glows (No Neon, Just Deep Luminous Radiance) -->
    <radialGradient id="sapphire-glow-left" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#0f2b6b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sapphire-glow-right" cx="80%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#1e3a8a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0" />
    </radialGradient>

    <!-- Frosted Glass Card Fill -->
    <linearGradient id="glass-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glass Rim / Specular Border Gradient -->
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.4" />
    </linearGradient>

    <!-- Top Accent Gradient Line -->
    <linearGradient id="top-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0" />
      <stop offset="25%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#60a5fa" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#2563eb" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0" />
    </linearGradient>

    <!-- Bento Card Subtle Pill Gradient -->
    <linearGradient id="pill-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Technical Dot Grid -->
    <pattern id="dot-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .font-hero { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; font-weight: 800; letter-spacing: -1.5px; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; font-weight: 500; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
  </style>

  <!-- Deep Obsidian Base -->
  <rect width="1200" height="370" fill="url(#bg-canvas)" rx="16" />

  <!-- Sapphire Ambient Glows for Depth -->
  <rect width="1200" height="370" fill="url(#sapphire-glow-left)" rx="16" />
  <rect width="1200" height="370" fill="url(#sapphire-glow-right)" rx="16" />

  <!-- Subtle Dot Grid Overlay -->
  <rect width="1200" height="370" fill="url(#dot-grid)" rx="16" />

  <!-- Top Luminous Line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#top-accent)" rx="1.5" />

  <!-- Subtle Outer Border -->
  <rect x="1" y="1" width="1198" height="368" rx="15" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-opacity="0.7" />

  <!-- LEFT HERO SECTION -->
  <g transform="translate(68, 52)">
    <!-- Glassmorphic Status Pill -->
    <g>
      <rect x="0" y="0" width="260" height="30" rx="15" fill="#0f172a" fill-opacity="0.8" stroke="url(#glass-border)" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="19.5" class="font-mono" font-size="11.5" font-weight="600" fill="#93c5fd" letter-spacing="0.5">ENGINEER &amp; RESEARCHER</text>
    </g>

    <!-- Main Title with Dimensional Crispness -->
    <text x="0" y="98" class="font-hero" font-size="58" fill="#ffffff">
      Vedant Divate
    </text>

    <!-- Professional Subtitle -->
    <text x="2" y="134" class="font-sub" font-size="20" fill="#93c5fd" letter-spacing="-0.3">
      AI &amp; Data Science · Full-Stack Systems
    </text>

    <!-- Academic Anchor -->
    <text x="2" y="164" class="font-sub" font-size="14.5" fill="#64748b">
      Vishwakarma Institute of Technology (VIT Pune) · Class of 2026
    </text>

    <!-- Frosted Bento Tags -->
    <g transform="translate(0, 194)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="144" height="30" rx="7" fill="url(#pill-fill)" stroke="#334155" stroke-width="1" stroke-opacity="0.8"/>
        <text x="14" y="19" class="font-mono" font-size="12" fill="#cbd5e1">⚡ AST Tooling</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(154, 0)">
        <rect width="146" height="30" rx="7" fill="url(#pill-fill)" stroke="#334155" stroke-width="1" stroke-opacity="0.8"/>
        <text x="14" y="19" class="font-mono" font-size="12" fill="#cbd5e1">⚙️ Web Workers</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(310, 0)">
        <rect width="142" height="30" rx="7" fill="url(#pill-fill)" stroke="#334155" stroke-width="1" stroke-opacity="0.8"/>
        <text x="14" y="19" class="font-mono" font-size="12" fill="#cbd5e1">🧠 Symbolic AI</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(462, 0)">
        <rect width="148" height="30" rx="7" fill="url(#pill-fill)" stroke="#334155" stroke-width="1" stroke-opacity="0.8"/>
        <text x="14" y="19" class="font-mono" font-size="12" fill="#cbd5e1">🛡️ Data Provenance</text>
      </g>
    </g>

    <!-- Tagline -->
    <text x="2" y="258" class="font-sub" font-size="13.5" fill="#64748b">
      Architecting verifiable, observable developer tools and human-in-the-loop systems.
    </text>
  </g>

  <!-- RIGHT BENTO GLASS CARD -->
  <g transform="translate(690, 46)">
    <!-- Outer Glow Silhouette -->
    <rect x="-1" y="-1" width="442" height="276" rx="15" fill="none" stroke="url(#glass-border)" stroke-width="1.5" />
    <!-- Glassmorphic Panel -->
    <rect width="440" height="274" rx="14" fill="url(#glass-fill)" />

    <!-- Frosted Header Bar -->
    <rect width="440" height="38" rx="14" fill="#0f172a" fill-opacity="0.9" />
    <rect y="26" width="440" height="12" fill="#0f172a" fill-opacity="0.9" />
    <line x1="0" y1="38" x2="440" y2="38" stroke="#1e293b" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="22" cy="19" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="38" cy="19" r="4.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="54" cy="19" r="4.5" fill="#10b981" opacity="0.8" />

    <!-- Terminal Breadcrumb -->
    <text x="230" y="23" class="font-mono" font-size="11.5" fill="#64748b" text-anchor="middle">workspace: ~/vedant-divate</text>

    <!-- Bento Inner Content -->
    <g transform="translate(24, 62)">
      <!-- Row 1: Focus -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" class="font-mono" font-size="12" fill="#60a5fa">const</text>
        <text x="44" y="14" class="font-mono" font-size="12" fill="#f1f5f9">craft</text>
        <text x="84" y="14" class="font-mono" font-size="12" fill="#64748b">=</text>
        <text x="98" y="14" class="font-mono" font-size="12" fill="#93c5fd">{</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(18, 24)">
        <text x="0" y="14" class="font-mono" font-size="11.5" fill="#94a3b8">coreStack:</text>
        <text x="82" y="14" class="font-mono" font-size="11.5" fill="#38bdf8">["TypeScript", "Python", "React"]</text>
        <text x="315" y="14" class="font-mono" font-size="11.5" fill="#64748b">,</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(18, 48)">
        <text x="0" y="14" class="font-mono" font-size="11.5" fill="#94a3b8">systems:</text>
        <text x="68" y="14" class="font-mono" font-size="11.5" fill="#38bdf8">["AST Visualizer", "Workers", "IPFS"]</text>
        <text x="325" y="14" class="font-mono" font-size="11.5" fill="#64748b">,</text>
      </g>

      <!-- Row 4 -->
      <g transform="translate(18, 72)">
        <text x="0" y="14" class="font-mono" font-size="11.5" fill="#94a3b8">reasoning:</text>
        <text x="80" y="14" class="font-mono" font-size="11.5" fill="#38bdf8">"SWI-Prolog Symbolic AI"</text>
        <text x="250" y="14" class="font-mono" font-size="11.5" fill="#64748b">,</text>
      </g>

      <!-- Row 5 -->
      <g transform="translate(18, 96)">
        <text x="0" y="14" class="font-mono" font-size="11.5" fill="#94a3b8">ethos:</text>
        <text x="48" y="14" class="font-mono" font-size="11.5" fill="#34d399">"Observable · Verifiable · Fast"</text>
      </g>

      <!-- Row 6 -->
      <g transform="translate(0, 120)">
        <text x="0" y="14" class="font-mono" font-size="12" fill="#93c5fd">};</text>
      </g>

      <!-- Divider Inside Card -->
      <line x1="0" y1="148" x2="390" y2="148" stroke="#1e293b" stroke-width="1" />

      <!-- Interactive Status Line -->
      <g transform="translate(0, 168)">
        <circle cx="6" cy="6" r="3.5" fill="#10b981" />
        <text x="18" y="10" class="font-mono" font-size="11.5" fill="#94a3b8">Ready to collaborate on ambitious software</text>
      </g>
    </g>
  </g>
</svg>