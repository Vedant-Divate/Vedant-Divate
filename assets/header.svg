<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" role="img" aria-label="Vedant Divate - AI &amp; Software Engineer Profile Banner">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <!-- Vibrant Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5" />
    </linearGradient>

    <!-- Ambient Orbs -->
    <radialGradient id="glow-cyan" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#070a13" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="85%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#070a13" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="30" cy="0" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .font-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .font-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, Monaco, monospace; }
  </style>

  <!-- Deep Canvas Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />

  <!-- Ambient Glows -->
  <rect width="1200" height="360" fill="url(#glow-cyan)" rx="16" />
  <rect width="1200" height="360" fill="url(#glow-purple)" rx="16" />

  <!-- Background Technical Grid -->
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Top Accent Neon Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent-grad)" rx="2" />

  <!-- LEFT HERO SECTION -->
  <g transform="translate(60, 48)">
    <!-- Status Pill -->
    <g>
      <rect x="0" y="0" width="285" height="30" rx="15" fill="#0f172a" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.5" />
      <circle cx="16" cy="15" r="4.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="19" class="font-mono" font-size="11.5" font-weight="600" fill="#a5f3fc" letter-spacing="0.5">OPEN TO INTERNSHIPS · PUNE, IN</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="98" class="font-title" font-size="56" fill="#f8fafc" letter-spacing="-1.5">
      Vedant Divate
    </text>

    <!-- Subtitle -->
    <text x="2" y="132" class="font-body" font-size="20" font-weight="600" fill="#93c5fd" letter-spacing="-0.2">
      AI &amp; Data Science Engineer · Full-Stack Builder
    </text>

    <!-- College & Credential -->
    <text x="2" y="162" class="font-body" font-size="14.5" fill="#94a3b8">
      Vishwakarma Institute of Technology (VIT Pune) · 3rd Year B.Tech
    </text>

    <!-- Focus Tags / Pills -->
    <g transform="translate(0, 192)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="138" height="28" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" stroke-opacity="0.6"/>
        <text x="12" y="18" class="font-mono" font-size="12" fill="#c7d2fe">Developer Tooling</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(148, 0)">
        <rect width="118" height="28" rx="6" fill="#0c4a6e" stroke="#0284c7" stroke-width="1" stroke-opacity="0.6"/>
        <text x="12" y="18" class="font-mono" font-size="12" fill="#bae6fd">AST Visualizer</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(276, 0)">
        <rect width="124" height="28" rx="6" fill="#3b0764" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6"/>
        <text x="12" y="18" class="font-mono" font-size="12" fill="#e9d5ff">Symbolic AI &amp; HITL</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(410, 0)">
        <rect width="108" height="28" rx="6" fill="#143126" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
        <text x="12" y="18" class="font-mono" font-size="12" fill="#a7f3d0">Web3 Escrow</text>
      </g>
    </g>

    <!-- Short Tagline -->
    <text x="2" y="254" class="font-body" font-size="13.5" fill="#64748b">
      Building observable, verifiable software from low-level AST transforms to decentralized systems.
    </text>
  </g>

  <!-- RIGHT TERMINAL CARD (Glassmorphism & Code Box) -->
  <g transform="translate(680, 42)">
    <!-- Terminal Shadow / Outer Border -->
    <rect x="-1" y="-1" width="462" height="272" rx="13" fill="none" stroke="url(#border-grad)" stroke-width="1.5" />
    <!-- Terminal Background -->
    <rect width="460" height="270" rx="12" fill="#0a0f1d" fill-opacity="0.9" />

    <!-- Terminal Header Bar -->
    <rect width="460" height="34" rx="12" fill="#131b2e" />
    <rect y="24" width="460" height="10" fill="#131b2e" />
    <!-- Window Control Buttons -->
    <circle cx="20" cy="17" r="5" fill="#ef4444" opacity="0.85" />
    <circle cx="36" cy="17" r="5" fill="#f59e0b" opacity="0.85" />
    <circle cx="52" cy="17" r="5" fill="#10b981" opacity="0.85" />

    <!-- Terminal Title -->
    <text x="230" y="21" class="font-mono" font-size="11.5" fill="#64748b" text-anchor="middle">vedant@engineer:~ (zsh)</text>

    <!-- Terminal Content -->
    <g transform="translate(20, 56)">
      <!-- Prompt 1 -->
      <text x="0" y="14" class="font-mono" font-size="12.5" fill="#38bdf8">$</text>
      <text x="16" y="14" class="font-mono" font-size="12.5" fill="#f1f5f9"> cat profile.json</text>

      <text x="0" y="38" class="font-mono" font-size="12" fill="#94a3b8">{</text>
      
      <text x="16" y="58" class="font-mono" font-size="12" fill="#a78bfa">"specialties"</text>
      <text x="108" y="58" class="font-mono" font-size="12" fill="#94a3b8">: [</text>
      <text x="124" y="58" class="font-mono" font-size="12" fill="#34d399">"Developer Tools"</text>
      <text x="250" y="58" class="font-mono" font-size="12" fill="#94a3b8">, </text>
      <text x="264" y="58" class="font-mono" font-size="12" fill="#34d399">"AI Systems"</text>
      <text x="348" y="58" class="font-mono" font-size="12" fill="#94a3b8">],</text>

      <text x="16" y="78" class="font-mono" font-size="12" fill="#a78bfa">"stack"</text>
      <text x="64" y="78" class="font-mono" font-size="12" fill="#94a3b8">: </text>
      <text x="78" y="78" class="font-mono" font-size="12" fill="#fbbf24">"TypeScript · Python · React · Node"</text>
      <text x="350" y="78" class="font-mono" font-size="12" fill="#94a3b8">,</text>

      <text x="16" y="98" class="font-mono" font-size="12" fill="#a78bfa">"highlights"</text>
      <text x="100" y="98" class="font-mono" font-size="12" fill="#94a3b8">: [</text>
      <text x="116" y="98" class="font-mono" font-size="12" fill="#38bdf8">"LogicLens"</text>
      <text x="194" y="98" class="font-mono" font-size="12" fill="#94a3b8">, </text>
      <text x="208" y="98" class="font-mono" font-size="12" fill="#38bdf8">"LinkPe"</text>
      <text x="262" y="98" class="font-mono" font-size="12" fill="#94a3b8">, </text>
      <text x="276" y="98" class="font-mono" font-size="12" fill="#38bdf8">"SameDrug"</text>
      <text x="348" y="98" class="font-mono" font-size="12" fill="#94a3b8">],</text>

      <text x="16" y="118" class="font-mono" font-size="12" fill="#a78bfa">"seeking"</text>
      <text x="80" y="118" class="font-mono" font-size="12" fill="#94a3b8">: </text>
      <text x="96" y="118" class="font-mono" font-size="12" fill="#4ade80">"SWE / AI Internships (2025-2026)"</text>

      <text x="0" y="138" class="font-mono" font-size="12" fill="#94a3b8">}</text>

      <!-- Prompt 2 -->
      <g transform="translate(0, 162)">
        <text x="0" y="14" class="font-mono" font-size="12.5" fill="#38bdf8">$</text>
        <text x="16" y="14" class="font-mono" font-size="12.5" fill="#f1f5f9"> ping -c 1 divatevedant@gmail.com</text>
        <text x="0" y="34" class="font-mono" font-size="11.5" fill="#4ade80">✓ 64 bytes: 0% packet loss — Ready to connect!</text>
      </g>
    </g>
  </g>

  <!-- Bottom Subtle Border -->
  <line x1="0" y1="359" x2="1200" y2="359" stroke="#1e293b" stroke-width="1" />
</svg>