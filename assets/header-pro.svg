<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" role="img" aria-label="Vedant Divate — Software Engineer Profile Banner">
  <defs>
    <!-- Background Gradient: Deep Onyx to Graphite -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d13" />
      <stop offset="60%" stop-color="#10131b" />
      <stop offset="100%" stop-color="#0e1017" />
    </linearGradient>

    <!-- Subtle Hairline Accent Gradient: Titanium / Muted Steel -->
    <linearGradient id="hairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#64748b" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#94a3b8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.1" />
    </linearGradient>

    <!-- Subtle Card Border -->
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.6" />
    </linearGradient>

    <!-- Subtle Radial Vignette -->
    <radialGradient id="vignette" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#1e2536" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0b0d13" stop-opacity="0" />
    </radialGradient>

    <!-- Architectural Grid Pattern -->
    <pattern id="arch-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#181d28" stroke-width="0.8" />
      <circle cx="32" cy="0" r="0.8" fill="#334155" />
    </pattern>
  </defs>

  <style>
    .name-title { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; font-weight: 700; letter-spacing: -1px; }
    .meta-text { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .mono-text { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="340" fill="url(#bg)" rx="12" />
  <rect width="1200" height="340" fill="url(#vignette)" rx="12" />
  <rect width="1200" height="340" fill="url(#arch-grid)" rx="12" />

  <!-- Top Hairline Rule -->
  <rect x="0" y="0" width="1200" height="1.5" fill="url(#hairline)" />

  <!-- Outer Border -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="11.5" fill="none" stroke="#1e2433" stroke-width="1" />

  <!-- LEFT HERO SECTION -->
  <g transform="translate(68, 54)">
    <!-- Category Eyebrow Pill -->
    <g>
      <rect x="0" y="0" width="224" height="26" rx="13" fill="#141822" stroke="#262f40" stroke-width="1" />
      <circle cx="14" cy="13" r="3.5" fill="#64748b" />
      <text x="26" y="17" class="mono-text" font-size="11" font-weight="500" fill="#94a3b8" letter-spacing="0.6">ENGINEER &amp; BUILDER</text>
    </g>

    <!-- Primary Title -->
    <text x="0" y="90" class="name-title" font-size="52" fill="#f8fafc">
      Vedant Divate
    </text>

    <!-- Subtitle / Focus -->
    <text x="1" y="124" class="meta-text" font-size="18" font-weight="500" fill="#cbd5e1" letter-spacing="-0.2">
      AI &amp; Data Science · Full-Stack Systems
    </text>

    <!-- University & Location -->
    <text x="1" y="152" class="meta-text" font-size="14" fill="#64748b">
      Vishwakarma Institute of Technology (VIT Pune) · Class of 2026
    </text>

    <!-- Elegant Monochrome Spec Badges -->
    <g transform="translate(0, 184)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="134" height="26" rx="4" fill="#141824" stroke="#262e42" stroke-width="1"/>
        <text x="11" y="17" class="mono-text" font-size="11.5" fill="#94a3b8">Developer Tooling</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(144, 0)">
        <rect width="128" height="26" rx="4" fill="#141824" stroke="#262e42" stroke-width="1"/>
        <text x="11" y="17" class="mono-text" font-size="11.5" fill="#94a3b8">AST Instrumentation</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(282, 0)">
        <rect width="112" height="26" rx="4" fill="#141824" stroke="#262e42" stroke-width="1"/>
        <text x="11" y="17" class="mono-text" font-size="11.5" fill="#94a3b8">Symbolic Logic</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(404, 0)">
        <rect width="118" height="26" rx="4" fill="#141824" stroke="#262e42" stroke-width="1"/>
        <text x="11" y="17" class="mono-text" font-size="11.5" fill="#94a3b8">Data Provenance</text>
      </g>
    </g>

    <!-- Concise Monochromatic Tagline -->
    <text x="1" y="244" class="meta-text" font-size="13" fill="#64748b">
      Focused on observable execution, runtime introspection, and robust data architectures.
    </text>
  </g>

  <!-- RIGHT ARCHITECTURAL TELEMETRY CARD -->
  <g transform="translate(710, 48)">
    <!-- Container Card -->
    <rect width="422" height="244" rx="8" fill="#0d1017" stroke="url(#card-border)" stroke-width="1" />

    <!-- Card Header -->
    <rect width="422" height="36" rx="8" fill="#131620" />
    <rect y="28" width="422" height="8" fill="#131620" />
    <line x1="0" y1="36" x2="422" y2="36" stroke="#1f2533" stroke-width="1" />

    <!-- Minimal Dot Indicators (Monochrome) -->
    <circle cx="20" cy="18" r="4" fill="#334155" />
    <circle cx="34" cy="18" r="4" fill="#334155" />
    <circle cx="48" cy="18" r="4" fill="#334155" />

    <!-- Card Title -->
    <text x="211" y="22" class="mono-text" font-size="11" fill="#64748b" text-anchor="middle" letter-spacing="0.5">profile.config.ts</text>

    <!-- Card Details Rows -->
    <g transform="translate(24, 60)">
      <!-- Row 1 -->
      <text x="0" y="14" class="mono-text" font-size="12" fill="#64748b">const</text>
      <text x="44" y="14" class="mono-text" font-size="12" fill="#cbd5e1">engineer</text>
      <text x="110" y="14" class="mono-text" font-size="12" fill="#64748b">=</text>
      <text x="126" y="14" class="mono-text" font-size="12" fill="#94a3b8">{</text>

      <!-- Row 2 -->
      <text x="16" y="38" class="mono-text" font-size="11.5" fill="#64748b">domain:</text>
      <text x="76" y="38" class="mono-text" font-size="11.5" fill="#e2e8f0">"Developer Tooling &amp; Systems"</text>
      <text x="315" y="38" class="mono-text" font-size="11.5" fill="#64748b">,</text>

      <!-- Row 3 -->
      <text x="16" y="60" class="mono-text" font-size="11.5" fill="#64748b">stack:</text>
      <text x="64" y="60" class="mono-text" font-size="11.5" fill="#e2e8f0">"TypeScript · Python · React · Node"</text>
      <text x="345" y="60" class="mono-text" font-size="11.5" fill="#64748b">,</text>

      <!-- Row 4 -->
      <text x="16" y="82" class="mono-text" font-size="11.5" fill="#64748b">core:</text>
      <text x="56" y="82" class="mono-text" font-size="11.5" fill="#cbd5e1">["AST", "Web Workers", "Prolog"]</text>
      <text x="295" y="82" class="mono-text" font-size="11.5" fill="#64748b">,</text>

      <!-- Row 5 -->
      <text x="16" y="104" class="mono-text" font-size="11.5" fill="#64748b">location:</text>
      <text x="88" y="104" class="mono-text" font-size="11.5" fill="#94a3b8">"Pune, India"</text>

      <!-- Row 6 -->
      <text x="0" y="126" class="mono-text" font-size="12" fill="#94a3b8">};</text>

      <!-- Divider inside card -->
      <line x1="0" y1="140" x2="374" y2="140" stroke="#1a202c" stroke-width="1" />

      <!-- Footer Telemetry -->
      <g transform="translate(0, 158)">
        <circle cx="5" cy="5" r="3" fill="#64748b" />
        <text x="16" y="9" class="mono-text" font-size="11" fill="#64748b">status: active · open to collaboration</text>
      </g>
    </g>
  </g>
</svg>