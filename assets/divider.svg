<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="100%" height="70" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="dline" gradientUnits="userSpaceOnUse" x1="60" y1="35" x2="1140" y2="35">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="28%" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#a855f7" stop-opacity="0.95"/>
      <stop offset="82%" stop-color="#ec4899" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="dcore" gradientUnits="userSpaceOnUse" x1="578" y1="35" x2="622" y2="35">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6">
        <animate attributeName="x1" values="0%;-40%" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="100%;60%" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="dglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <line x1="60" y1="35" x2="1140" y2="35" stroke="url(#dline)" stroke-width="2" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" values="48;0" dur="3.2s" repeatCount="indefinite"/>
  </line>

  <g filter="url(#dglow)">
    <rect x="556" y="20" width="88" height="30" rx="15" fill="#0d1426" stroke="#a855f7" stroke-opacity="0.5"/>
    <g fill="none" stroke="url(#dcore)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="588,27 580,35 588,43"/>
      <line x1="604" y1="27" x2="596" y2="43"/>
      <polyline points="612,27 620,35 612,43"/>
    </g>
  </g>

  <circle cx="534" cy="35" r="2.6" fill="#22d3ee">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="666" cy="35" r="2.6" fill="#ec4899">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
