<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 48" width="100%" height="48" role="img" aria-label="Section Divider">
  <defs>
    <linearGradient id="div-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0" />
      <stop offset="20%" stop-color="#2563eb" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#2563eb" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="div-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Center Glow -->
  <circle cx="600" cy="24" r="22" fill="url(#div-glow)" />

  <!-- Tapered Line -->
  <line x1="80" y1="24" x2="1120" y2="24" stroke="url(#div-line)" stroke-width="1.5" />

  <!-- Center Glass Core Pill -->
  <rect x="582" y="16" width="36" height="16" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.7" />
  <circle cx="600" cy="24" r="3" fill="#93c5fd" />
</svg>
